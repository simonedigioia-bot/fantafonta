<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FantaFonta - Pagina Personale</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- LIBRERIA UFFICIALE SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --verde-scuro: #006633; 
            --verde-chiaro: #e6f0eb;
            --sfondo-chiaro: #f4f6f8; 
            --testo-scuro: #111111; 
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body { 
            margin: 0; 
            padding: 0; 
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--sfondo-chiaro); 
            color: var(--testo-scuro); 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
        }

        .header { 
            text-align: center; 
            padding: 12px 10px; 
            background: white; 
            border-bottom: 1px solid #e5e5e5; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-logo {
            height: 48px;
            width: auto;
            object-fit: contain;
            image-rendering: -webkit-optimize-contrast;
        }

        .nav-buttons { 
            display: flex; 
            justify-content: center; 
            gap: 8px; 
            padding: 10px 12px; 
            background: #ffffff; 
            border-bottom: 1px solid #e5e5e5;
        }

        .btn { 
            flex: 1;
            max-width: 120px;
            text-align: center;
            padding: 10px 4px; 
            border: 2px solid var(--verde-scuro); 
            background: white; 
            color: var(--verde-scuro); 
            font-weight: 700; 
            border-radius: 8px; 
            cursor: pointer; 
            text-decoration: none; 
            font-size: 13px; 
        }

        .btn.active { 
            background: var(--verde-scuro); 
            color: white; 
        }

        .content { 
            flex: 1; 
            padding: 15px; 
            max-width: 450px; 
            margin: 0 auto; 
            width: 100%; 
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 25px 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid #eaeaea;
            text-align: center;
            margin-top: 5px;
        }

        .badge-tessera {
            display: inline-block;
            background: var(--verde-chiaro);
            color: var(--verde-scuro);
            font-size: 12px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 20px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .player-name { 
            font-family: 'Anton', sans-serif; 
            font-size: 30px; 
            color: var(--testo-scuro); 
            margin: 0 0 20px 0; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
            line-height: 1.2;
        }

        .score-box {
            background: #f8faf9;
            border: 1px solid var(--verde-scuro);
            border-radius: 12px;
            padding: 20px 15px;
            margin-top: 10px;
        }

        .score-label {
            font-size: 12px;
            font-weight: 700;
            color: #666;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .player-score { 
            font-family: 'Anton', sans-serif; 
            font-size: 58px; 
            color: var(--verde-scuro); 
            line-height: 1;
        }

        .player-score span {
            font-size: 24px;
        }

        .not-active-msg { 
            font-size: 16px; 
            color: #555; 
            line-height: 1.5; 
        }

        .tuttocampo-section {
            max-width: 450px;
            margin: 10px auto 15px auto;
            width: 100%;
            padding: 0 15px;
        }

        .btn-tuttocampo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: #ffffff;
            color: var(--verde-scuro);
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 12px;
            border: 2px solid var(--verde-scuro);
            font-weight: 700;
            font-size: 11.5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            width: 100%;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn-tuttocampo:hover {
            background-color: var(--verde-chiaro);
        }

        .btn-tuttocampo:active {
            transform: scale(0.98);
        }

        .btn-tuttocampo img {
            height: 20px;
            width: auto;
            object-fit: contain;
        }

        .footer { 
            background-color: var(--verde-scuro); 
            color: white; 
            text-align: center; 
            padding: 20px 15px; 
            margin-top: auto; 
        }

        .sponsor-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 12px;
            background: rgba(255, 255, 255, 0.15);
            padding: 15px 10px;
            border-radius: 8px;
            border: none;
            overflow: hidden;
        }

        .sponsor-logo {
            height: 35px;
            max-width: 90px;
            object-fit: contain;
            display: inline-block;
            border: none !important;
            outline: none;
        }

        .sponsor-logo.sponsor-grande {
            height: 48px;
            max-width: 120px;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="header">
        <img src="/img/logo-fantafonta.png" alt="FantaFonta" class="main-logo">
    </div>

    <div class="nav-buttons">
        <a href="personale.html?tessera=1" class="btn active">Personale</a>
        <a href="index.html" class="btn">Classifica</a>
        <a href="regolamento.html" class="btn">Regolamento</a>
    </div>

    <div class="content" id="content-area">
        <div class="card">
            <p style="color:#666; margin:0;">Caricamento profilo in corso...</p>
        </div>
    </div>

    <div class="tuttocampo-section">
        <a href="https://www.tuttocampo.it/Liguria/GE/TerzaCategoria/GironeBGenova/Risultati" target="_blank" class="btn-tuttocampo">
            <img src="/img/f-logo.png" alt="F">
            Risultati e Classifiche su Tuttocampo
        </a>
    </div>

    <div class="footer">
        <p style="margin:0; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:1px; opacity:0.85;">Sponsor Ufficiali</p>
        <div class="sponsor-container">
            <img src="/img/sponsor1.png" alt="Annibaldi" class="sponsor-logo">
            <img src="/img/sponsor2.png" alt="K Service" class="sponsor-logo sponsor-grande">
            <img src="/img/sponsor3.png" alt="La Terrazza" class="sponsor-logo sponsor-grande">
            <img src="/img/sponsor4.png" alt="Qualità e Passione" class="sponsor-logo">
            <img src="/img/sponsor5.png" alt="DEO" class="sponsor-logo">
            <img src="/img/sponsor6.png" alt="Pisacane" class="sponsor-logo sponsor-grande">
            <img src="/img/sponsor7.png" alt="Tekno Ambiente" class="sponsor-logo">
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://xyyvmobvcggbqracdkki.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5eXZtb2J2Y2dnYnFyYWNka2tpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4MTU3MDYsImV4cCI6MjA5ODM5MTcwNn0.QpN5HQQxdz77w50e-OOd9GdnoX2B7y8d-4CYeNWyx2U';
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function getNumeroTessera() {
            const pathParts = window.location.pathname.split('/').filter(p => p.length > 0);
            if (pathParts.length > 0 && pathParts[0] === 'p' && pathParts[1]) {
                const parsed = parseInt(pathParts[1], 10);
                if (!isNaN(parsed)) return parsed;
            }
            const urlParams = new URLSearchParams(window.location.search);
            const tesseraParam = urlParams.get('tessera');
            if (tesseraParam) {
                const parsed = parseInt(tesseraParam, 10);
                if (!isNaN(parsed)) return parsed;
            }
            return 1;
        }

        async function caricaProfilo() {
            const numTessera = parseInt(getNumeroTessera(), 10);
            const contentArea = document.getElementById('content-area');

            try {
                const { data, error } = await _supabase
                    .from('Tessere')
                    .select('*')
                    .eq('numero_tessera', numTessera);

                if (error) {
                    contentArea.innerHTML = `
                        <div class="card">
                            <p style="color:red; margin:0;">Errore del database: ${error.message}</p>
                        </div>`;
                    return;
                }

                if (!data || data.length === 0) {
                    contentArea.innerHTML = `
                        <div class="card">
                            <div class="badge-tessera">Tessera n° ${numTessera}</div>
                            <div class="not-active-msg">Tessera non trovata.</div>
                        </div>`;
                    return;
                }

                const tessera = data.length > 0 ? data[0] : null;

                if (!tessera || !tessera.attiva) {
                    contentArea.innerHTML = `
                        <div class="card">
                            <div class="badge-tessera">Tessera n° ${numTessera}</div>
                            <div class="not-active-msg">Questa tessera non è ancora stata attivata.<br>Acquistala dallo staff per iniziare a giocare!</div>
                        </div>`;
                    return;
                }

                const nome = tessera.nome_tifoso || `TESSERA N° ${tessera.numero_tessera}`;
                const punti = (tessera.punti !== undefined && tessera.punti !== null) ? tessera.punti : 0;

                contentArea.innerHTML = `
                    <div class="card">
                        <div class="badge-tessera">TESSERA N° ${tessera.numero_tessera}</div>
                        <div class="player-name">${nome}</div>
                        <div class="score-box">
                            <div class="score-label">Punti Totali</div>
                            <div class="player-score">${punti} <span>Pt.</span></div>
                        </div>
                    </div>
                `;

            } catch (err) {
                contentArea.innerHTML = `
                    <div class="card">
                        <p style="color:red; margin:0;">Errore generico: ${err.message}</p>
                    </div>`;
            }
        }

        caricaProfilo();
    </script>
</body>
</html>

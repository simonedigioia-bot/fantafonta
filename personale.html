<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FantaFonta - Pagina Personale</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --verde-scuro: #006633; --verde-chiaro: #008844; --sfondo-grigio: #f0f0f0; }
        body { margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; background-color: var(--sfondo-grigio); color: #333; display: flex; flex-direction: column; min-height: 100vh; }
        .header { text-align: center; padding: 20px 10px; background: white; }
        .logo { font-family: 'Anton', sans-serif; font-size: 2.5rem; color: var(--verde-scuro); text-transform: uppercase; letter-spacing: 2px; margin: 0; }
        .logo span { font-style: italic; color: var(--verde-chiaro); }
        .nav-container { display: flex; flex-direction: column; gap: 10px; align-items: center; padding: 10px; background: white; }
        .btn-main { width: 90%; max-width: 350px; padding: 12px; border: 2px solid var(--verde-scuro); border-radius: 8px; background: white; color: var(--verde-scuro); font-weight: bold; font-size: 1.1rem; text-align: center; text-decoration: none; }
        .nav-row { display: flex; width: 90%; max-width: 350px; gap: 10px; }
        .btn-sub { flex: 1; padding: 10px; border: 2px solid var(--verde-scuro); border-radius: 8px; background: white; color: var(--verde-scuro); font-weight: bold; text-align: center; text-decoration: none; }
        .btn-active { background: var(--verde-scuro) !important; color: white !important; }
        .profile-container { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 30px 20px; text-align: center; }
        .player-name { font-size: 1.8rem; color: var(--verde-scuro); font-weight: bold; margin-bottom: 20px; font-style: italic; }
        .profile-data { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 30px; width: 100%; max-width: 400px; }
        .player-photo { width: 110px; height: 110px; border-radius: 50%; object-fit: cover; background: #ccc; border: 3px solid white; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .player-score { font-family: 'Anton', sans-serif; font-size: 3.5rem; color: var(--verde-scuro); }
        .player-score span { font-size: 1.5rem; font-family: 'Montserrat', sans-serif; font-weight: bold; margin-left: 5px; }
        .timeline-box { width: 100%; max-width: 350px; background: white; border-radius: 12px; padding: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); text-align: left; }
        .timeline-title { font-weight: bold; color: var(--verde-scuro); margin-top: 0; margin-bottom: 15px; border-bottom: 2px solid var(--sfondo-grigio); padding-bottom: 5px; }
        .timeline-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 0.95rem; }
        .points-plus { color: #00aa44; font-weight: bold; }
        .points-minus { color: #ff3333; font-weight: bold; }
        .sponsor-section { background: var(--verde-scuro); color: white; text-align: center; padding: 20px 10px; margin-top: auto; }
        .sponsor-title { font-style: italic; font-size: 1.2rem; margin-bottom: 15px; }
        .sponsor-box { border: 1px solid white; padding: 20px; max-width: 350px; margin: 0 auto; background: rgba(0,0,0,0.1); }
        .not-active-msg { font-size: 1.2rem; color: #666; margin: 40px; font-weight: bold; }
        .loader { margin: 40px; font-size: 1.1rem; color: var(--verde-scuro); }
    </style>
</head>
<body>
    <div class="header"><h1 class="logo">Fanta<span>Fonta</span></h1></div>
    <div class="nav-container">
        <a href="/classifica.html" class="btn-main">Classifica</a>
        <div class="nav-row">
            <a href="/regolamento.html" class="btn-sub">Regolamento</a>
            <a href="#" class="btn-sub btn-active">Personale</a>
        </div>
    </div>
    <div id="content-area" class="profile-container">
        <div class="loader" id="loader">Caricamento dati tessera...</div>
    </div>
    <div class="sponsor-section">
        <div class="sponsor-title">Sponsor by</div>
        <div class="sponsor-box">AREA DEDICATA LOGHI SPONSOR</div>
    </div>

    <script>
        const SUPABASE_URL = "https://xyyvmobvcggbqracdkki.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_AuD-8UcuGqNI4UygtYSRDA_wa7mVH4f";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function getNumeroTessera() {
            const path = window.location.pathname;
            const segments = path.split('/');
            const lastSegment = segments[segments.length - 1] || segments[segments.length - 2];
            const numero = parseInt(lastSegment);
            return isNaN(numero) ? 1 : numero;
        }

        async function caricaProfilo() {
            const numTessera = getNumeroTessera();
            const contentArea = document.getElementById('content-area');
            try {
                const { data: tessera, error: errTessera } = await _supabase
                    .from('Tessere')
                    .select('*')
                    .eq('numero_tessera', numTessera)
                    .single();

                if (errTessera || !tessera) {
                    contentArea.innerHTML = `<div class="not-active-msg">Errore nel caricamento della tessera #${numTessera}.</div>`;
                    return;
                }
                if (!tessera.attiva) {
                    contentArea.innerHTML = `
                        <div class="player-name">Tessera #${numTessera}</div>
                        <div class="not-active-msg">Questa tessera non è ancora stata attivata.<br>Acquistala dallo staff per iniziare a giocare!</div>
                    `;
                    return;
                }

                const { data: cronologia } = await _supabase
                    .from('cronologia_punti')
                    .select('*')
                    .eq('tessera_id', tessera.id)
                    .order('data_assegnazione', { ascending: false });

                const fotoUrl = tessera.foto_url || 'https://via.placeholder.com/150';
                let htmlCronologia = '<div class="timeline-box"><p class="timeline-title">Storico Punti</p>';
                if (cronologia && cronologia.length > 0) {
                    cronologia.forEach(item => {
                        const segno = item.punti_assegnati >= 0 ? '+' : '';
                        const classePunti = item.punti_assegnati >= 0 ? 'points-plus' : 'points-minus';
                        htmlCronologia += `
                            <div class="timeline-item">
                                <span>${item.descrizione}</span>
                                <span class="${classePunti}">${segno}${item.punti_assegnati}pt</span>
                            </div>
                        `;
                    });
                } else {
                    htmlCronologia += '<div class="timeline-item">Nessun punto assegnato finora.</div>';
                }
                htmlCronologia += '</div>';

                contentArea.innerHTML = `
                    <div class="player-name">${tessera.nome_tifoso}</div>
                    <div class="profile-data">
                        <img src="${fotoUrl}" class="player-photo" alt="Foto">
                        <div class="player-score">${tessera.punti}<span>Pt.</span></div>
                    </div>
                    ${htmlCronologia}
                `;
            } catch (e) {
                contentArea.innerHTML = `<div class="not-active-msg">Errore di connessione al server.</div>`;
            }
        }
        caricaProfilo();
    </script>
</body>
</html>

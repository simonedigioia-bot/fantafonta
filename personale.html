<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FantaFonta - Pagina Personale</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --verde-scuro: #006633;
            --verde-chiaro: #008844;
            --sfondo-chiaro: #ffffff;
            --testo-scuro: #111111;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--sfondo-chiaro);
            color: var(--testo-scuro);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            padding: 20px 10px;
            background: white;
            border-bottom: 1px solid #eee;
        }
        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 15px;
            background: #f9f9f9;
        }
        .btn {
            padding: 10px 20px;
            border: 2px solid var(--verde-scuro);
            background: white;
            color: var(--verde-scuro);
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }
        .btn.active {
            background: var(--verde-scuro);
            color: white;
        }
        .content {
            flex: 1;
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
        }
        .player-name {
            font-family: 'Anton', sans-serif;
            font-size: 32px;
            color: var(--testo-scuro);
            margin-bottom: 15px;
            text-transform: uppercase;
        }
        .profile-data {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }
        .player-photo {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--verde-scuro);
        }
        .player-score {
            font-family: 'Anton', sans-serif;
            font-size: 48px;
            color: var(--verde-scuro);
        }
        .player-score span {
            font-size: 20px;
            font-family: 'Montserrat', sans-serif;
        }
        .timeline-box {
            background: #f4f4f4;
            border-radius: 8px;
            padding: 15px;
            text-align: left;
        }
        .timeline-title {
            font-weight: bold;
            margin-bottom: 10px;
            border-bottom: 2px solid var(--verde-scuro);
            padding-bottom: 5px;
            color: var(--verde-scuro);
        }
        .timeline-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #ddd;
            font-size: 14px;
        }
        .timeline-item:last-child {
            border-bottom: none;
        }
        .points-plus { color: var(--verde-scuro); font-weight: bold; }
        .points-minus { color: #cc0000; font-weight: bold; }
        .not-active-msg {
            font-size: 18px;
            color: #666;
            margin-top: 30px;
            line-height: 1.5;
        }
        .debug-error {
            background: #ffe6e6;
            color: #cc0000;
            padding: 15px;
            border-radius: 8px;
            font-size: 13px;
            text-align: left;
            margin-top: 15px;
            word-break: break-all;
        }
        .footer {
            background-color: var(--verde-scuro);
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: auto;
        }
        .sponsor-box {
            border: 1px solid rgba(255,255,255,0.4);
            padding: 15px;
            margin-top: 10px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 style="font-family:'Anton'; color:var(--verde-scuro); margin:0;">FANTA<i>FONTA</i></h1>
    </div>

    <div class="nav-buttons">
        <a href="/" class="btn">Classifica</a>
        <a href="#" class="btn">Regolamento</a>
        <a href="#" class="btn active">Personale</a>
    </div>

    <div class="content" id="content-area">
        <p>Caricamento dati...</p>
    </div>

    <div class="footer">
        <p style="margin:0; font-size:14px; font-style:italic;">Sponsor by</p>
        <div class="sponsor-box">AREA DEDICATA LOGHI SPONSOR</div>
    </div>

    <script>
        const SUPABASE_URL = 'https://xyyvmobvcqgbqracdkki.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_AuD-8UcUGqNI4UygtYSRDA_wa7mVH4f';
        
        let _supabase;
        if (window.supabase) {
            _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        }

        function getNumeroTessera() {
            const pathParts = window.location.pathname.split('/').filter(p => p.length > 0);
            if (pathParts.length > 0 && pathParts[0] === 'p' && pathParts[1]) {
                return pathParts[1];
            }
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('tessera') || '181';
        }

        async function caricaProfilo() {
            const numTesseraStr = getNumeroTessera();
            const numTesseraInt = parseInt(numTesseraStr, 10);
            const contentArea = document.getElementById('content-area');

            if (!_supabase) {
                contentArea.innerHTML = `<div class="not-active-msg">Errore: Libreria Supabase non caricata.</div>`;
                return;
            }

            try {
                let { data: tessere, error: errTessera } = await _supabase
                    .from('Tessere')
                    .select('*')
                    .eq('numero_tessera', numTesseraInt);

                if (!tessere || tessere.length === 0) {
                    let resId = await _supabase
                        .from('Tessere')
                        .select('*')
                        .eq('id', numTesseraInt);
                    if (resId.data && resId.data.length > 0) {
                        tessere = resId.data;
                    }
                }

                if (errTessera) {
                    contentArea.innerHTML = `
                        <div class="not-active-msg">Errore durante la lettura dati.</div>
                        <div class="debug-error"><b>Dettaglio Errore Supabase:</b><br>${errTessera.message}</div>
                    `;
                    return;
                }

                const tessera = (tessere && tessere.length > 0) ? tessere[0] : null;

                if (!tessera) {
                    contentArea.innerHTML = `<div class="not-active-msg">Tessera #${numTesseraStr} non trovata.</div>`;
                    return;
                }

                if (!tessera.attiva) {
                    contentArea.innerHTML = `
                        <div class="player-name">Tessera #${numTesseraStr}</div>
                        <div class="not-active-msg">Questa tessera non è ancora stata attivata.<br>Acquistala dallo staff per iniziare a giocare!</div>
                    `;
                    return;
                }

                let cronologia = [];
                try {
                    const { data: dataCronologia } = await _supabase
                        .from('_punti cronologia')
                        .select('*')
                        .eq('numero_tessera', numTesseraInt)
                        .order('created_at', { ascending: false });
                    if (dataCronologia) cronologia = dataCronologia;
                } catch (e) {
                    // Ignora
                }

                const fotoUrl = tessera.foto_url || 'https://via.placeholder.com/150/006633/FFFFFF?text=FantaFonta';
                let htmlCronologia = '<div class="timeline-box"><p class="timeline-title">Storico Punti</p>';
                if (cronologia && cronologia.length > 0) {
                    cronologia.forEach(item => {
                        const segno = item.punti_assegnati >= 0 ? '+' : '';
                        const classePunti = item.punti_assegnati >= 0 ? 'points-plus' : 'points-minus';
                        htmlCronologia += `
                            <div class="timeline-item">
                                <span>${item.descrizione || 'Bonus/Malus'}</span>
                                <span class="${classePunti}">${segno}${item.punti_assegnati}pt</span>
                            </div>
                        `;
                    });
                } else {
                    htmlCronologia += '<div class="timeline-item">Nessun punto assegnato finora.</div>';
                }
                htmlCronologia += '</div>';

                contentArea.innerHTML = `
                    <div class="player-name">${tessera.nome_tifoso || 'Tifoso #' + numTesseraStr}</div>
                    <div class="profile-data">
                        <img src="${fotoUrl}" class="player-photo" alt="Foto">
                        <div class="player-score">${tessera.punti || 0}<span>Pt.</span></div>
                    </div>
                    ${htmlCronologia}
                `;
            } catch (e) {
                contentArea.innerHTML = `
                    <div class="not-active-msg">Errore di rete/connessione.</div>
                    <div class="debug-error"><b>Dettaglio Errore:</b><br>${e.message || e}</div>
                `;
            }
        }

        caricaProfilo();
    </script>
</body>
</html>

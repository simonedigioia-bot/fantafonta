<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FantaFonta - Pagina Personale</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <!-- LIBRERIA UFFICIALE SUPABASE PER EVITARE BLOCCHI -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --verde-scuro: #006633; --sfondo-chiaro: #ffffff; --testo-scuro: #111111; }
        body { margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; background-color: var(--sfondo-chiaro); color: var(--testo-scuro); display: flex; flex-direction: column; min-height: 100vh; }
        .header { text-align: center; padding: 20px 10px; background: white; border-bottom: 1px solid #eee; }
        .nav-buttons { display: flex; justify-content: center; gap: 10px; padding: 15px; background: #f9f9f9; }
        .btn { padding: 10px 20px; border: 2px solid var(--verde-scuro); background: white; color: var(--verde-scuro); font-weight: bold; border-radius: 6px; cursor: pointer; text-decoration: none; font-size: 14px; }
        .btn.active { background: var(--verde-scuro); color: white; }
        .content { flex: 1; padding: 20px; max-width: 500px; margin: 0 auto; width: 100%; box-sizing: border-box; text-align: center; }
        .player-name { font-family: 'Anton', sans-serif; font-size: 32px; color: var(--testo-scuro); margin-bottom: 15px; text-transform: uppercase; }
        .player-score { font-family: 'Anton', sans-serif; font-size: 48px; color: var(--verde-scuro); }
        .not-active-msg { font-size: 18px; color: #555; margin-top: 20px; line-height: 1.5; }
        .footer { background-color: var(--verde-scuro); color: white; text-align: center; padding: 20px; margin-top: auto; }
    </style>
</head>
<body>

    <div class="header">
        <h1 style="font-family:'Anton'; color:var(--verde-scuro); margin:0;">FANTA<i>FONTA</i></h1>
    </div>

    <div class="nav-buttons">
        <a href="/" class="btn">Classifica</a>
        <a href="#" class="btn">Regolamento</a>
        <a href="#" class="btn active">Personale</a>
    </div>

    <div class="content" id="content-area">
        <p>Caricamento profilo in corso...</p>
    </div>

    <div class="footer">
        <p style="margin:0; font-size:14px; font-style:italic;">Sponsor by</p>
        <div style="border:1px solid rgba(255,255,255,0.4); padding:15px; margin-top:10px; font-size:12px;">AREA DEDICATA LOGHI SPONSOR</div>
    </div>

    <script>
        // Inizializzazione Client Ufficiale Supabase (URL CORRETTO)
        const SUPABASE_URL = 'https://xyyvmobvcggbqracdkki.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5eXZtb2J2Y2dnYnFyYWNka2tpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4MTU3MDYsImV4cCI6MjA5ODM5MTcwNn0.QpN5HQQxdz77w50e-OOd9GdnoX2B7y8d-4CYeNWyx2U';
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function getNumeroTessera() {
            const pathParts = window.location.pathname.split('/').filter(p => p.length > 0);
            if (pathParts.length > 0 && pathParts[0] === 'p' && pathParts[1]) {
                return pathParts[1];
            }
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('tessera') || '1';
        }

        async function caricaProfilo() {
            const numTessera = parseInt(getNumeroTessera(), 10);
            const contentArea = document.getElementById('content-area');

            try {
                // Interroga la tabella Tessere tramite la libreria ufficiale
                const { data, error } = await _supabase
                    .from('Tessere')
                    .select('*')
                    .eq('numero_tessera', numTessera);

                if (error) {
                    contentArea.innerHTML = `<p style="color:red;">Errore del database: ${error.message}</p>`;
                    return;
                }

                if (!data || data.length === 0) {
                    contentArea.innerHTML = `<div class="not-active-msg">Tessera #${numTessera} non trovata.</div>`;
                    return;
                }

                const tessera = data[0];

                if (!tessera.attiva) {
                    contentArea.innerHTML = `
                        <div class="player-name">Tessera #${tessera.numero_tessera}</div>
                        <div class="not-active-msg">Questa tessera non è ancora stata attivata.<br>Acquistala dallo staff per iniziare a giocare!</div>
                    `;
                    return;
                }

                const nome = tessera.nome_tifoso || `Tessera #${tessera.numero_tessera}`;
                const punti = tessera.punti || 0;
                const foto = tessera.foto_url || 'https://via.placeholder.com/150/006633/FFFFFF?text=FantaFonta';

                contentArea.innerHTML = `
                    <div class="player-name">${nome}</div>
                    <div style="margin:20px 0;">
                        <img src="${foto}" alt="Foto Profilo" style="width:140px; height:140px; border-radius:50%; border:4px solid #006633; object-fit:cover;">
                        <div class="player-score" style="margin-top:15px;">${punti} <span style="font-size:24px;">Pt.</span></div>
                    </div>
                `;

            } catch (err) {
                contentArea.innerHTML = `<p style="color:red;">Errore generico: ${err.message}</p>`;
            }
        }

        caricaProfilo();
    </script>
</body>
</html>

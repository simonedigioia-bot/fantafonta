<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FantaFonta - Classifica Generale</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --verde-scuro: #006633; --verde-chiaro: #e6f0eb;
            --sfondo-chiaro: #f4f6f8; --testo-scuro: #111111; --card-bg: #ffffff;
        }
        * { box-sizing: border-box; }
        body { 
            margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; 
            background-color: var(--sfondo-chiaro); color: var(--testo-scuro); 
            display: flex; flex-direction: column; min-height: 100vh; 
        }
        .header { 
            text-align: center; padding: 12px 10px; background: white; 
            border-bottom: 1px solid #e5e5e5; display: flex; justify-content: center;
        }
        .main-logo { height: 48px; width: auto; object-fit: contain; }
        .nav-buttons { 
            display: flex; justify-content: center; gap: 8px; 
            padding: 10px 12px; background: #ffffff; border-bottom: 1px solid #e5e5e5;
        }
        .btn { 
            flex: 1; max-width: 120px; text-align: center; padding: 10px 4px; 
            border: 2px solid var(--verde-scuro); background: white; 
            color: var(--verde-scuro); font-weight: 700; border-radius: 8px; 
            cursor: pointer; text-decoration: none; font-size: 13px; 
        }
        .btn.active { background: var(--verde-scuro); color: white; }
        .content { flex: 1; padding: 15px; max-width: 450px; margin: 0 auto; width: 100%; }
        .card {
            background: var(--card-bg); border-radius: 16px; padding: 25px 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); border: 1px solid #eaeaea; text-align: center;
        }
        .titolo-classifica {
            font-family: 'Anton', sans-serif; font-size: 26px; color: var(--verde-scuro); 
            margin-top: 0; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .footer { background-color: var(--verde-scuro); color: white; text-align: center; padding: 20px 15px; margin-top: auto; }
    </style>
</head>
<body>

    <div class="header">
        <img src="/img/logo-fantafonta.png" alt="FantaFonta" class="main-logo" onerror="this.style.display='none'">
    </div>

    <!-- NOTA I LINK CON LO SLASH (/) DAVANTI! -->
    <div class="nav-buttons">
        <a href="/personale.html" id="link-personale" class="btn">Personale</a>
        <a href="/index.html" id="link-classifica" class="btn">Classifica</a>
        <a href="/regolamento.html" id="link-regolamento" class="btn">Regolamento</a>
    </div>

    <div class="content">
        <div class="card">
            <h2 class="titolo-classifica">Classifica Generale</h2>
            <div id="contenitore-classifica">
                <p>Classifica in fase di aggiornamento...</p>
            </div>
        </div>
    </div>

    <div class="footer">
        <p style="margin:0; font-size:12px; font-weight:700;">FANTAFONTA 2024</p>
    </div>

    <!-- SCRIPT MAGICO PER LA NAVIGAZIONE UNIFICATO -->
    <script>
        function impostaNavigazione() {
            const urlParams = new URLSearchParams(window.location.search);
            let numTessera = urlParams.get('tessera');

            const pathParts = window.location.pathname.split('/').filter(p => p.length > 0);
            if (!numTessera && pathParts.length > 0 && pathParts[0] === 'p' && pathParts[1]) {
                numTessera = pathParts[1];
            }

            if (numTessera && !isNaN(numTessera)) {
                localStorage.setItem('miaTessera', numTessera);
            } else {
                numTessera = localStorage.getItem('miaTessera');
                if (numTessera && isNaN(numTessera)) {
                    localStorage.removeItem('miaTessera');
                    numTessera = null;
                }
            }

            let suffisso = (numTessera && !isNaN(numTessera)) ? '?tessera=' + numTessera : '';

            const linkPersonale = document.getElementById('link-personale');
            const linkClassifica = document.getElementById('link-classifica');
            const linkRegolamento = document.getElementById('link-regolamento');

            if (linkPersonale) linkPersonale.href = '/personale.html' + suffisso;
            if (linkClassifica) linkClassifica.href = '/index.html' + suffisso;
            if (linkRegolamento) linkRegolamento.href = '/regolamento.html' + suffisso;
            
            const currentPage = window.location.pathname.toLowerCase();
            if (currentPage.includes('personale') || currentPage.includes('/p/')) {
                if (linkPersonale) { linkPersonale.classList.add('active'); linkPersonale.href = '#'; }
            } else if (currentPage.includes('regolamento')) {
                if (linkRegolamento) { linkRegolamento.classList.add('active'); linkRegolamento.href = '#'; }
            } else { 
                if (linkClassifica) { linkClassifica.classList.add('active'); linkClassifica.href = '#'; }
            }
        }
        document.addEventListener('DOMContentLoaded', impostaNavigazione);
    </script>
</body>
</html>
